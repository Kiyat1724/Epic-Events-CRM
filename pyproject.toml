[project]
name = "epic-events-crm"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "click>=8.5.0",
    "psycopg[binary]>=3.3.5",
    "pyjwt>=2.14.0",
    "python-dotenv>=1.2.3",
    "sentry-sdk>=2.69.1",
    "sqlalchemy>=2.0.52",
]


[tool.black]
target-version = ["py313"]
line-length = 88
[dependency-groups]
dev = [
    "black>=26.5.1",
    "flake8>=7.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
